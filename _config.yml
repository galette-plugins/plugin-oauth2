remote_theme: galette/theme-ghpages
title: Galette oAuth2
description: Galette oAuth2 server
maintainer: community
# No version here: it comes from the latest GitHub release. The nightly URL has
# to be spelt out though, because this plugin's rolling prerelease sits on a tag
# named `dev` rather than the usual `nightly` — that name once carried an
# immutable release, and deleting one burns its tag for good.
plugin:
  archive: galette-plugin-oauth2
  min_galette: "1.3.0"
  nightly_url: https://github.com/galette-plugins/plugin-oauth2/releases/download/dev/galette-plugin-oauth2-dev.tar.bz2
# No `lang` here: the theme takes it from the first path segment, and a `lang` in
# the defaults would override that for every page, translated ones included.
defaults:
  - scope: {path: ""}
    values: {layout: default}

# Without this, README.md would be copied into the published site. It used to be
# the index page; index.md is now, which is what gives the theme a `ref: home`
# to build the menu and the language selector from.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
