name: Linux

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  pull_request:
  # Enable manual run
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Lint on PHP ${{ matrix.php-versions }}"

    strategy:
      matrix:
        php-versions: [ '8.2', '8.5' ]
        coverage: [none]
      fail-fast: false

    steps:
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer
          coverage: ${{ matrix.coverage }}

      - name: Checkout Galette core
        uses: actions/checkout@v6
        with:
          repository: galette/galette
          path: galette-core
          fetch-depth: 1
          ref: develop

      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          path: galette-core/galette/plugins/plugin-oauth2

      - name: Install dependencies
        run: |
          cd galette-core
          composer install --ignore-platform-reqs
          cd galette/plugins/plugin-oauth2
          composer install --ignore-platform-reqs

      - name: CS
        run: |
          cd galette-core/galette/plugins/plugin-oauth2
          ../../vendor/bin/phpcs lib/ ./*.php

      - name: CS Fixer
        if: matrix.php-versions == '8.2'
        run: |
          cd galette-core/galette/plugins/plugin-oauth2
          ../../vendor/bin/php-cs-fixer check --show-progress=dots --verbose --diff

      - name: Twig CS
        run: |
          cd galette-core/galette/plugins/plugin-oauth2
          ../../vendor/bin/twigcs templates/default --severity error --display blocking

      - name: PHPStan checks
        run: |
          cd galette-core/galette/plugins/plugin-oauth2
          ../../vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress

      - name: Headers checks
        run: |
          cd galette-core/galette/plugins/plugin-oauth2
          ../../vendor/bin/docheader check lib ./*.php

  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          #always tests higher stable php version with lower db version
          #enable coverage on higher stable php version with higher postrgesql version
          #lower php version
          - { php-version: "8.2", db-image: "mysql:5.7", coverage: none, always: false }
          - { php-version: "8.2", db-image: "mysql:8.1", coverage: none, always: false }
          - { php-version: "8.2", db-image: "mariadb:10.4", coverage: none, always: false }
          - { php-version: "8.2", db-image: "mariadb:11", coverage: none, always: false }
          - { php-version: "8.2", db-image: "postgres:11", coverage: none, always: false }
          - { php-version: "8.2", db-image: "postgres:16", coverage: none, always: false }
          #higher stable php version
          - { php-version: "8.5", db-image: "mysql:5.7", coverage: none, always: true }
          - { php-version: "8.5", db-image: "mysql:8.1", coverage: none, always: false }
          - { php-version: "8.5", db-image: "mariadb:10.4", coverage: none, always: true }
          - { php-version: "8.5", db-image: "mariadb:11", coverage: none, always: false }
          - { php-version: "8.5", db-image: "postgres:11", coverage: none, always: true }
          - { php-version: "8.5", db-image: "postgres:16", coverage: none, always: true }
      fail-fast: false

    env:
      skip: ${{ matrix.always == false && (github.event_name == 'pull_request' || github.repository != 'galette/plugin-oauth2' || !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags'))) }}
      DB: ${{ matrix.db-image }}

    services:
      # Label used to access the service container
      db:
        # Docker Hub image
        image: ${{ matrix.db-image }}
        # Provide env variables for both mysql and pgsql
        env:
          POSTGRES_USER: galette_tests
          POSTGRES_PASSWORD: g@l3tte
          POSTGRES_DB: galette_tests
          MYSQL_USER: galette_tests
          MYSQL_PASSWORD: g@l3tte
          MYSQL_ROOT_PASSWORD: g@l3tte
          MYSQL_DATABASE: galette_tests
        # Open network ports for both mysql and pgsql
        ports:
          - 3306:3306
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd="bash -c 'if [[ -n $(command -v pg_isready) ]]; then pg_isready; else if [[ -n $(command -v mysqladmin) ]]; then mysqladmin ping; else mariadb-admin ping; fi fi'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    name: PHP ${{ matrix.php-version }} ${{ matrix.db-image }} ${{ (matrix.always == false && (github.event_name == 'pull_request' || github.repository != 'galette/plugin-oauth2' || !(github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')))) && ' (skipped)' || matrix.coverage == 'xdebug' && ' (with coverage)' || ''}}

    steps:
      - name: PHP
        if: env.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer, pecl
          coverage: ${{ matrix.coverage }}
          extensions: apcu
          ini-values: apc.enable_cli=1

      - name: Show database version
        if: env.skip != 'true'
        run: |
          docker exec ${{ job.services.db.id }} bash -c "if [[ -n \$(command -v psql) ]]; then psql --version; else if [[ -n \$(command -v mysql) ]]; then mysql --version; else mariadb --version; fi fi"

      - name: Build Galette
        if: env.skip != 'true'
        uses: galette/.github/actions/build-galette@main
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout plugin
        if: env.skip != 'true'
        uses: actions/checkout@v6
        with:
          path: galette-core/galette/plugins/plugin-oauth2

      - name: Install plugin dependencies
        if: env.skip != 'true'
        run: |
          cd galette-core/galette/plugins/plugin-oauth2
          composer install --ignore-platform-reqs

      - name: Generate keys
        if: env.skip != 'true'
        run: |
          cd galette-core/galette/plugins/plugin-oauth2/tests/config
          openssl genrsa -out private.key 2048
          openssl rsa -in private.key -pubout -out public.key
          chmod 660 *.key
          sed "s/KEY/$(../../vendor/bin/generate-defuse-key)/" -i encryption-key.php

      - name: Init for PostgreSQL
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          cd galette-core
          bin/console galette:install -v --dbtype=pgsql --dbhost=localhost --dbname=galette_tests --dbuser=galette_tests --dbpass=g@l3tte --admin=admin --password=admin --no-interaction -w
          bin/console galette:plugins:install-db --all
        if: env.skip != 'true' && startsWith(matrix.db-image, 'postgres')

      - name: Init for MariaDB
        run: |
          cd galette-core
          mysql -e 'create database IF NOT EXISTS galette_tests;' -u galette_tests --password=g@l3tte -h 127.0.0.1 -P 3306
          bin/console galette:install -v --dbtype=mysql --dbhost=127.0.0.1 --dbname=galette_tests --dbuser=galette_tests --dbpass=g@l3tte --admin=admin --password=admin --no-interaction -w
          bin/console galette:plugins:install-db --all
        if: env.skip != 'true' && (startsWith(matrix.db-image, 'mysql') || startsWith(matrix.db-image, 'mariadb'))

      - name: Unit tests
        if: env.skip != 'true'
        run: |
          cd galette-core/galette/webroot
          php -S localhost:8888 ../plugins/plugin-oauth2/tests/router.php &
          cd ../plugins/plugin-oauth2
          ../../vendor/bin/phpunit --test-suffix=.php --bootstrap tests/TestsBootstrap.php --no-coverage --process-isolation tests/GaletteOAuth2/
